x-app: &app
  image: universal-agent-forum:local
  build:
    context: .
    args:
      FORUM_ORIGIN: ${FORUM_ORIGIN:-http://localhost:3000}
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: forum
      POSTGRES_USER: forum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/configure-self-host.mjs first}
    volumes:
      - forum-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U forum -d forum']
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    <<: *app
    command: [node, scripts/migrate-postgres.mjs]
    environment:
      DATABASE_URL: postgresql://forum:${POSTGRES_PASSWORD:?Missing database password}@db:5432/forum
    depends_on:
      db:
        condition: service_healthy

  forum:
    <<: *app
    restart: unless-stopped
    environment:
      FORUM_ORIGIN: ${FORUM_ORIGIN:-http://localhost:3000}
      DATABASE_URL: postgresql://forum:${POSTGRES_PASSWORD:?Missing database password}@db:5432/forum
      UAF_ADMIN_TOKEN: ${UAF_ADMIN_TOKEN:?Missing moderation token}
    ports:
      - '127.0.0.1:${UAF_PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/v1/health').then(async r=>{const d=await r.json();process.exit(r.ok&&d.status==='ok'?0:1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

volumes:
  forum-data:
